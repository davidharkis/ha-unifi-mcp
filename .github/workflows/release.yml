name: Build and publish HA app
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'
  push:
    branches: [main]
    paths: ['unifi_network_mcp/**', 'scripts/**', 'tests/**', '.github/workflows/**']
permissions:
  contents: write
  packages: write
  pull-requests: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install aiohttp pyyaml packaging
      - name: Check stable upstream release
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: update
        run: python scripts/update.py
      - name: Read configured app version
        id: version
        run: |
          python - <<'PY'
          import os, yaml
          version = yaml.safe_load(open('unifi_network_mcp/config.yaml'))['version']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - name: Test authentication, streaming, and read-only settings
        run: python -m unittest discover -s tests -v
      - name: Build candidate image
        if: steps.update.outputs.changed == 'true' || github.event_name != 'schedule'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: docker build --build-arg BUILD_VERSION="$VERSION" --tag candidate unifi_network_mcp
      - name: Check installed dependencies and server imports
        if: steps.update.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          docker run --rm --entrypoint pip candidate check
          docker run --rm --entrypoint python candidate -c 'import unifi_network_mcp; import gateway'
      - uses: docker/login-action@v3
        if: steps.update.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image before advertising update
        if: steps.update.outputs.changed == 'true' || github.event_name != 'schedule'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          IMAGE=ghcr.io/davidharkis/ha-unifi-network-mcp
          docker tag candidate "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION"
      - name: Propose successful release to Home Assistant
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: automation/unifi-mcp-update
          base: main
          add-paths: |
            unifi_network_mcp/config.yaml
            unifi_network_mcp/requirements.txt
            unifi_network_mcp/CHANGELOG.md
          commit-message: Update UniFi MCP after successful build and checks
          title: Update UniFi MCP to ${{ steps.version.outputs.version }}
          body: |
            Update the Home Assistant app to `${{ steps.version.outputs.version }}`.

            Tests, the Linux image build, dependency checks and server imports passed before the image was published to GHCR.
            Validation run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Merge this PR to offer the update in Home Assistant. This PR uses GITHUB_TOKEN, so its creation does not trigger additional push or pull_request workflows.
